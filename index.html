body{margin:0;font:14px system-ui,sans-serif}

<style>
/* Layout: banda rossa in alto come i siti della rete Caritas, contenuti su fondo chiaro in una colonna da telefono, barra schede in basso */
:root{
  --red:#c8102e; --red-deep:#9e0b23; --on-red:#ffffff;
  --bg:#f6f5f4; --surface:#ffffff; --ink:#231f20; --muted:#5f5a5b; --line:#e6e2e1;
  --red-soft:#fbe8eb; --ok:#1d7a4a; --ok-soft:#e2f2e9;
  --shadow:0 1px 2px rgba(35,31,32,.06),0 4px 14px rgba(35,31,32,.06);
  --display:"Titillium Web","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#ff4d63; --red-deep:#a3122a; --on-red:#ffffff;
  --bg:#141617; --surface:#1f2224; --ink:#f1efee; --muted:#a9a3a2; --line:#33373a;
  --red-soft:#3b1a20; --ok:#5cd096; --ok-soft:#163226; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#ff4d63; --red-deep:#a3122a; --on-red:#ffffff;
  --bg:#141617; --surface:#1f2224; --ink:#f1efee; --muted:#a9a3a2; --line:#33373a;
  --red-soft:#3b1a20; --ok:#5cd096; --ok-soft:#163226; --shadow:none; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red-deep)}
.gutter{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--red-deep);color:var(--on-red)}
.topbar .gutter{display:flex;align-items:center;gap:10px;padding-block:10px}
.mark{width:30px;height:30px;flex:none}
.brand{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand small{font-size:.75rem;opacity:.85}
.band{background:var(--red-deep);color:var(--on-red)}
.band .gutter{padding-block:8px 64px;display:grid;gap:10px}
.band blockquote{margin:0;font-family:var(--display);font-weight:600;font-size:1.65rem;line-height:1.2;text-wrap:balance}
.band cite{font-style:normal;font-size:.85rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.wrap{padding-block:20px 110px;display:grid;gap:22px}
.band:not([hidden]) + .wrap{margin-top:-48px;padding-top:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.06rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--red);font-weight:700}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:8px;min-width:0}
button.card{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.card:hover,a.card:hover{border-color:var(--red)}
a.card{color:inherit;text-decoration:none}
.apri{color:var(--red);font-weight:700;font-size:.9rem}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mod{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.ico{width:44px;height:44px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mod > div{display:grid;gap:6px;min-width:0}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.btn{font:inherit;font-family:var(--display);font-weight:700;letter-spacing:.02em;border:0;border-radius:999px;padding:11px 22px;background:var(--red);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn{color:#1d0b0e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1d0b0e}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;font:inherit;color:var(--red);font-weight:700;cursor:pointer;padding:0;justify-self:start}
.progress{gap:12px}
.progress .big{font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1;color:var(--red)}
.metodo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metodo button{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 12px;display:grid;gap:4px;min-width:0}
.metodo button:hover{border-color:var(--red)}
.metodo b{font-family:var(--display);font-size:1.05rem;color:var(--red)}
.metodo span{font-size:.85rem;color:var(--muted);line-height:1.35}
@media (max-width:420px){.metodo{grid-template-columns:1fr}}
.search{width:100%;font:inherit;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-sizing:border-box}
.lesson-body{display:grid;gap:12px;max-width:65ch}
.lesson-body ul{margin:0;padding-left:20px;display:grid;gap:6px}
.lesson-body li::marker{color:var(--red)}
.callout{padding:14px 16px;background:var(--red-soft);border-radius:var(--r);font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.35}
.opt{font:inherit;color:inherit;text-align:left;width:100%;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.num{font-variant-numeric:tabular-nums}
.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.phones .card{gap:2px}
.phone{font-family:var(--display);font-weight:900;font-size:1.5rem;color:var(--red);user-select:all}
.phones p{font-size:.82rem;line-height:1.3}
@media (max-width:420px){.phones{grid-template-columns:1fr}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{font:inherit;font-family:var(--display);font-size:.78rem;font-weight:600;background:none;border:0;border-top:3px solid transparent;color:var(--muted);padding:8px 4px 12px;display:grid;justify-items:center;gap:3px;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--red);border-top-color:var(--red)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.note{font-size:.85rem;color:var(--muted)}
.area{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;border-color:var(--red)}
.area > div{display:grid;gap:2px;min-width:0}
.campo{display:grid;gap:4px;font-weight:600}
.campo small,.chips legend{font-weight:400;color:var(--muted);font-size:.82rem}
.campo input,.campo select,.campo textarea,.pin,.copia-testo{font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.pin{font-size:1.6rem;letter-spacing:.5em;text-align:center;font-family:var(--display)}
.copia-testo{min-height:120px;font-size:.85rem}
.check{display:flex;gap:8px;align-items:center}
.check input,.chips input{accent-color:var(--red)}
.chips{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.chips legend{padding:0;margin-bottom:6px;font-weight:600;color:var(--ink);font-size:1rem}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0}
.chips span{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;cursor:pointer}
.chips input:checked + span{background:var(--red);border-color:var(--red);color:#fff}
.chips input:focus-visible + span{outline:3px solid var(--red);outline-offset:2px}
.pill{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--red-soft);color:var(--red);margin:2px 0}
.passaggio.fatto{opacity:.7}
.btn.piccolo{padding:8px 14px;font-size:.88rem}
.errore{color:var(--red);font-weight:600;min-height:1.2em}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
.avviso{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;transition:opacity .2s,transform .2s;z-index:20;pointer-events:none;max-width:calc(100% - 32px)}
.avviso.on{opacity:1;transform:translate(-50%,0)}

.sede{gap:10px}
.contatti{display:grid;gap:8px}
.contatti>div,.info{display:grid;gap:1px}
.contatti span,.info>span:first-child{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.info{padding-block:4px}
.info .tag{justify-self:start;margin-top:4px}
a.tel{color:var(--red);font-weight:700;text-decoration:none;font-family:var(--display);font-size:1.08rem}
.guida{padding:4px 0;gap:0}
.guida button{font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;display:grid;gap:2px;cursor:pointer}
.guida button:last-child{border-bottom:0}
.guida b{font-family:var(--display);font-weight:600}
.guida span{color:var(--muted);font-size:.92rem}
.passi{margin:0;padding-left:22px;display:grid;gap:8px}
.passi li::marker{color:var(--red);font-weight:700}
.switch{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muted)}
.switch input{accent-color:var(--red);width:18px;height:18px}

.news{padding:0;overflow:hidden;gap:0}
.news img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--red-soft)}
.news .txt{padding:14px 16px 16px;display:grid;gap:6px}
.news p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Fluidità: risposta al tocco e transizioni tra schermate */
html{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
.card,.btn,.opt,.metodo button{transition:transform .12s ease,border-color .2s,background-color .2s}
.card:active,.btn:active,.opt:active,.metodo button:active{transform:scale(.98)}
nav.tabs svg{transition:transform .15s ease}
nav.tabs button:active svg{transform:scale(.88)}
.opt.right{animation:pop .28s ease-out}
.opt.wrong{animation:scuoti .3s ease-in-out}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes scuoti{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.entra{animation:entra .24s ease-out}
.topbar{view-transition-name:topbar}
nav.tabs{view-transition-name:tabs}
html{--vt-out:-18px;--vt-in:18px}
html[data-dir="indietro"]{--vt-out:18px;--vt-in:-18px}
::view-transition-old(root){animation:vt-out .14s ease-in both}
::view-transition-new(root){animation:vt-in .22s ease-out both}
@keyframes vt-out{to{opacity:0;transform:translateX(var(--vt-out))}}
@keyframes vt-in{from{opacity:0;transform:translateX(var(--vt-in))}}
@media (prefers-reduced-motion: reduce){*,::view-transition-old(root),::view-transition-new(root){transition:none!important;animation:none!important}}
</style>


</head>

// Fasce aperte in una data: confronta giorno della settimana e, se indicata, la settimana del mese (1º, 2º…)
function fasceDel(q, data){
  const sett = Math.ceil(data.getDate()/7);
  return (q||[]).filter(f => f.g===data.getDay() && (!f.s || f.s.includes(sett)));
}
function apertiOggi(){
  const oggi = new Date(), lista = [];
  CENTRI.forEach(c => fasceDel(c.q, oggi).forEach(f => lista.push({ nome:c.nome, dove:c.indirizzo, f, tel:c.tel, vai:"ascolto" })));
  SERVIZI.forEach(s => fasceDel(s.q, oggi).forEach(f => lista.push({ nome:s.titolo, dove:s.indirizzo, f, tel:s.contatti&&s.contatti.tel, vai:s.id })));
  const min = t => { const [h,m] = t.split(":"); return +h*60 + +m; };
  return lista.sort((a,b) => min(a.f.d) - min(b.f.d));
}

let vista = { tab:"home" };
const scrollSchede = {};
const RIDOTTO = matchMedia("(prefers-reduced-motion: reduce)").matches;
const profondita = v => (v.servizio || v.area) ? 1 : 0;

function vai(v, { storia = true } = {}){
  const indietro = profondita(v) < profondita(vista);
  if (profondita(vista)===0) scrollSchede[vista.tab] = scrollY;
  if (storia) try { history.pushState(v,""); } catch(e){}
  vista = v;
  const cambia = () => { render(); scrollTo(0, profondita(v)===0 ? (scrollSchede[v.tab]||0) : 0); };
  if (document.startViewTransition && !RIDOTTO){
    document.documentElement.dataset.dir = indietro ? "indietro" : "avanti";
    document.startViewTransition(cambia);
  } else {
    cambia();
    if (!RIDOTTO){ app.classList.remove("entra"); void app.offsetWidth; app.classList.add("entra"); }
  }
}

function render(){
  document.getElementById("band").hidden = vista.tab!=="home" || !!vista.area;

}

// Area operatore: passaggi annotati al volo, da riportare poi in Matrioska.
// I dati restano SOLO su questo telefono, cifrati (AES-GCM) con una chiave ricavata dal PIN (PBKDF2).
// La chiave vive solo in memoria finché l'area è aperta: a riposo si legge solo testo cifrato.
const INTERVENTI = ["Ascolto","Emporio / viveri","Vestiario","Orientamento ai servizi","Utenze / affitto","Lavoro","Altro"];
const CHIAVE_DATI = "passaggi-cifrati", CHIAVE_TENT = "passaggi-tentativi", CHIAVE_N = "passaggi-da-inserire", CHIAVE_CENTRO = "passaggi-centro";
const VECCHIE = ["passaggi-v1","passaggi-pin"];   // versione senza cifratura, migrata al primo accesso
const MAX_TENTATIVI = 5, BLOCCO_MS = 10*60*1000, GIORNI_DOPO_INSERIMENTO = 7;
const leggi = (k, d) => { try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } };
const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const togli = k => { try { localStorage.removeItem(k); } catch(e){} };
const b64 = u8 => btoa(String.fromCharCode(...u8));
const daB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

let chiave = null, passaggi = null, ultimoUso = 0, nascostoDa = 0;

async function derivaChiave(pin, sale){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:sale, iterations:310000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function salvaPassaggi(){
  // I passaggi già inseriti in Matrioska si cancellano dopo 7 giorni
  const limite = Date.now() - GIORNI_DOPO_INSERIMENTO*24*3600*1000;
  passaggi = passaggi.filter(p => !p.inserito || p.inseritoIl > limite);
  const rec = leggi(CHIAVE_DATI, null), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, chiave, new TextEncoder().encode(JSON.stringify(passaggi))));
  const ok = scrivi(CHIAVE_DATI, { v:1, sale:rec.sale, iv:b64(iv), ct:b64(ct) });
  scrivi(CHIAVE_N, passaggi.filter(p => !p.inserito).length);
  return ok;
}
function chiudiArea(){ chiave = null; passaggi = null; }
function cancellaTutto(){ [CHIAVE_DATI, CHIAVE_TENT, CHIAVE_N, ...VECCHIE].forEach(togli); chiudiArea(); }

// Si richiude da sola dopo 10 minuti di inattività o 5 minuti con l'app in secondo piano
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { nascostoDa = Date.now(); return; }
  if (chiave && Date.now() - nascostoDa > 5*60*1000) { chiudiArea(); if (vista.area) render(); }
});

function avviso(t){
  let el = document.getElementById("avviso");
  if (!el){ el = document.createElement("div"); el.id = "avviso"; el.className = "avviso"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = t; el.classList.add("on");
  clearTimeout(avviso.t); avviso.t = setTimeout(() => el.classList.remove("on"), 2600);
}
const tornaIndietro = () => (history.state && history.state.area) ? history.back() : vai({tab:"home"});

function renderPassaggi(){
  if (chiave && Date.now() - ultimoUso > BLOCCO_MS) chiudiArea();
  if (!chiave) return renderPin();
  ultimoUso = Date.now();
  const daInserire = passaggi.filter(p => !p.inserito).sort((a,b) => a.quando.localeCompare(b.quando));
  const inseriti = passaggi.filter(p => p.inserito).sort((a,b) => b.quando.localeCompare(a.quando));
  const centroDefault = leggi(CHIAVE_CENTRO, CENTRI[0].nome);
  const ora = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  app.innerHTML = `<button class="back" id="indietro">‹ Indietro</button>
    <div class="stack"><span class="eyebrow">Area operatore</span><h1>Passaggi</h1>
      <p class="muted">Annota il passaggio adesso, riportalo in Matrioska quando hai tempo.</p></div>
    <form class="card stack" id="form-p" autocomplete="off">
      <h2>Nuovo passaggio</h2>
      <label class="campo">Quando<input type="datetime-local" id="p-quando" value="${ora}" required></label>
      <label class="campo">Centro di Ascolto<select id="p-centro">${CENTRI.map(c=>`<option ${c.nome===centroDefault?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
      <label class="campo">Persona<input id="p-codice" maxlength="20" placeholder="Codice Matrioska o iniziali" required autocapitalize="characters" spellcheck="false">
        <small>Mai nome e cognome: bastano il codice della scheda o le iniziali.</small></label>
      <label class="check"><input type="checkbox" id="p-nuovo"> Primo accesso (scheda da aprire in Matrioska)</label>
      <fieldset class="chips"><legend>Interventi</legend>${INTERVENTI.map((t,i)=>`<label><input type="checkbox" value="${esc(t)}" ${i===0?"checked":""}><span>${esc(t)}</span></label>`).join("")}</fieldset>
      <label class="campo">Promemoria (facoltativo)<input id="p-note" maxlength="80" placeholder="Es. rivedere tra 15 giorni" spellcheck="false">
        <small>Solo ciò che serve per Matrioska. Niente informazioni su salute, famiglia o storia personale: quelle vanno direttamente in Matrioska.</small></label>
      <button class="btn" type="submit">Salva passaggio</button>
    </form>
    <section class="stack">
      <div class="row"><h2>Da inserire in Matrioska <span class="tag num">${daInserire.length}</span></h2>
        ${daInserire.length?'<button class="back" id="copia">Copia riepilogo</button>':""}</div>
      ${daInserire.length ? daInserire.map(cardPassaggio).join("") : '<div class="card"><p class="muted">Nessun passaggio da inserire. Quelli che salvi compaiono qui.</p></div>'}
    </section>
    ${inseriti.length?`<details class="stack"><summary>Già inseriti (${inseriti.length}) · si cancellano dopo ${GIORNI_DOPO_INSERIMENTO} giorni</summary><div class="stack">${inseriti.map(cardPassaggio).join("")}</div></details>`:""}
    <p class="note">I passaggi restano solo su questo telefono, cifrati con il tuo PIN, e non vengono inviati a nessuno. Dopo ${MAX_TENTATIVI} PIN sbagliati si cancellano. Se cambi telefono o cancelli i dati del browser, quelli non ancora inseriti vanno persi.</p>
    <button class="back" id="blocca">Chiudi l'area operatore</button>`;

  document.getElementById("indietro").onclick = () => { chiudiArea(); tornaIndietro(); };
  document.getElementById("blocca").onclick = () => { chiudiArea(); render(); };
  document.getElementById("form-p").onsubmit = async e => {
    e.preventDefault();
    passaggi.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      quando: document.getElementById("p-quando").value,
      centro: document.getElementById("p-centro").value,
      codice: document.getElementById("p-codice").value.trim(),
      nuovo: document.getElementById("p-nuovo").checked,
      interventi: [...app.querySelectorAll(".chips input:checked")].map(x => x.value),
      note: document.getElementById("p-note").value.trim(),
      inserito: false
    });
    if (!await salvaPassaggi()) return avviso("Non riesco a salvare: controlla che il browser non sia in navigazione privata.");
    scrivi(CHIAVE_CENTRO, document.getElementById("p-centro").value);
    avviso("Passaggio salvato"); renderPassaggi();
  };
  app.querySelectorAll("[data-ins]").forEach(b => b.onclick = async () => {
    const p = passaggi.find(x => x.id===b.dataset.ins); if (!p) return;
    p.inserito = !p.inserito; p.inseritoIl = Date.now();
    await salvaPassaggi(); avviso(p.inserito ? "Segnato come inserito in Matrioska" : "Rimesso tra quelli da inserire"); renderPassaggi();
  });
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.conferma !== "1"){ b.dataset.conferma = "1"; b.textContent = "Conferma eliminazione"; return; }
    passaggi = passaggi.filter(p => p.id !== b.dataset.del); await salvaPassaggi(); avviso("Passaggio eliminato"); renderPassaggi();
  });
  const c = document.getElementById("copia");
  if (c) c.onclick = () => {
    const testo = daInserire.map(p => `${dataOra(p.quando)} · ${p.centro} · ${p.codice}${p.nuovo?" (primo accesso)":""} · ${p.interventi.join(", ")}${p.note?" · "+p.note:""}`).join("\n");
    const fallback = () => { const t = document.createElement("textarea"); t.value = testo; t.className = "copia-testo"; c.after(t); t.select(); avviso("Seleziona e copia il testo"); };
    navigator.clipboard ? navigator.clipboard.writeText(testo).then(() => avviso("Riepilogo copiato. Dopo l'uso copia altro testo per svuotare gli appunti."), fallback) : fallback();
  };
}

const dataOra = s => new Date(s).toLocaleString("it-IT", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
function cardPassaggio(p){
  return `<div class="card passaggio ${p.inserito?"fatto":""}">
    <div class="row"><b class="num">${dataOra(p.quando)}</b>${p.nuovo?'<span class="tag">Primo accesso</span>':""}</div>
    <h3>${esc(p.codice)}</h3>
    <p class="muted">${esc(p.centro)}</p>
    <p>${p.interventi.map(i=>`<span class="pill">${esc(i)}</span>`).join(" ")}</p>
    ${p.note?`<p class="muted">${esc(p.note)}</p>`:""}
    <div class="row" style="justify-content:flex-start">
      <button class="btn ${p.inserito?"ghost":""} piccolo" data-ins="${p.id}">${p.inserito?"Rimetti da inserire":"Inserito in Matrioska ✓"}</button>
      <button class="back" data-del="${p.id}">Elimina</button>
    </div></div>`;
}

function renderPin(){
  const rec = leggi(CHIAVE_DATI, null), vecchioPin = leggi("passaggi-pin", null), nuovo = !rec && !vecchioPin;
  const rimasti = MAX_TENTATIVI - leggi(CHIAVE_TENT, 0);
  app.innerHTML = `<button class="back" id="indietro">‹ Indietro</button>
    <div class="stack"><span class="eyebrow">Area operatore</span><h1>${nuovo?"Crea il tuo PIN":"Inserisci il PIN"}</h1>
    <p class="muted">${nuovo?"Scegli un PIN di 6 cifre, diverso da quello del telefono. Serve a cifrare i passaggi: senza PIN nessuno può leggerli, nemmeno tu.":"I passaggi su questo telefono sono cifrati con il tuo PIN."}</p></div>
    <form class="card stack" id="form-pin">
      <input class="pin" id="pin" type="password" inputmode="numeric" pattern="${nuovo?"[0-9]{6}":"[0-9]{4,6}"}" maxlength="6" autocomplete="off" required aria-label="PIN">
      ${nuovo?'<input class="pin" id="pin2" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required aria-label="Ripeti il PIN" placeholder="Ripeti">':""}
      <p class="errore" id="err" aria-live="polite">${!nuovo && rimasti<MAX_TENTATIVI?`Tentativi rimasti: ${rimasti}`:""}</p>
      <button class="btn" type="submit" id="pin-ok">${nuovo?"Salva PIN":"Apri"}</button>
    </form>
    ${nuovo?"":`<div class="stack"><button class="back" id="reset">Ho dimenticato il PIN</button><p class="note" id="reset-info" hidden>Il PIN non si può recuperare: è l'unica chiave dei dati. Puoi solo cancellare i passaggi salvati e crearne uno nuovo. <button class="back" id="reset-ok">Cancella tutto e ricomincia</button></p></div>`}`;
  document.getElementById("indietro").onclick = tornaIndietro;
  document.getElementById("pin").focus();
  const r = document.getElementById("reset");
  if (r) { r.onclick = () => document.getElementById("reset-info").hidden = false;
    document.getElementById("reset-ok").onclick = () => { cancellaTutto(); avviso("Area passaggi azzerata"); renderPin(); }; }
  document.getElementById("form-pin").onsubmit = async e => {
    e.preventDefault();
    const pin = document.getElementById("pin").value, err = document.getElementById("err"), btn = document.getElementById("pin-ok");
    if (!(nuovo ? /^[0-9]{6}$/ : /^[0-9]{4,6}$/).test(pin)) return err.textContent = nuovo ? "Il PIN deve avere 6 cifre." : "Il PIN ha da 4 a 6 cifre.";
    btn.disabled = true; err.textContent = "";
    try {
      if (nuovo){
        if (pin !== document.getElementById("pin2").value) return err.textContent = "I due PIN non coincidono.";
        const sale = crypto.getRandomValues(new Uint8Array(16));
        if (!scrivi(CHIAVE_DATI, { v:1, sale:b64(sale) })) return err.textContent = "Questo browser non permette di salvare dati: esci dalla navigazione privata.";
        chiave = await derivaChiave(pin, sale); passaggi = []; await salvaPassaggi();
      } else if (!rec){
        // Migrazione dalla versione senza cifratura: verifica il vecchio PIN e cifra i dati esistenti
        const h = [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("operatori-caritas:" + pin)))].map(x=>x.toString(16).padStart(2,"0")).join("");
        if (h !== vecchioPin) throw new Error("pin");
        const sale = crypto.getRandomValues(new Uint8Array(16));
        scrivi(CHIAVE_DATI, { v:1, sale:b64(sale) });
        chiave = await derivaChiave(pin, sale); passaggi = leggi("passaggi-v1", []); await salvaPassaggi(); VECCHIE.forEach(togli);
      } else {
        const k = await derivaChiave(pin, daB64(rec.sale));
        const dati = await crypto.subtle.decrypt({ name:"AES-GCM", iv:daB64(rec.iv) }, k, daB64(rec.ct));
        chiave = k; passaggi = JSON.parse(new TextDecoder().decode(dati));
      }
      togli(CHIAVE_TENT); ultimoUso = Date.now(); renderPassaggi();
    } catch(x) {
      const n = leggi(CHIAVE_TENT, 0) + 1;
      if (n >= MAX_TENTATIVI){ cancellaTutto(); avviso("Troppi tentativi: i passaggi sono stati cancellati"); return renderPin(); }
      scrivi(CHIAVE_TENT, n); document.getElementById("pin").value = "";
      err.textContent = `PIN non corretto. Tentativi rimasti: ${MAX_TENTATIVI - n}`;
    } finally { btn.disabled = false; }
  };
}

function cerca(q){
  const out = document.getElementById("risultati");
  if (q.length<2){ out.innerHTML=""; return; }
  const ris = [];
  SERVIZI.forEach(s => { if ([s.titolo,s.sotto,s.testo,s.indirizzo||""].join(" ").toLowerCase().includes(q)) ris.push(`<button class="card" data-serv="${s.id}"><span class="eyebrow">Servizio</span><h3>${esc(s.titolo)}</h3></button>`); });
  CENTRI.forEach(c => { if ([c.nome,c.indirizzo,c.orario].join(" ").toLowerCase().includes(q)) ris.push(`<button class="card" data-serv="ascolto"><span class="eyebrow">Centro di Ascolto</span><h3>${esc(c.nome)}</h3><p class="muted">${esc(c.orario)}</p></button>`); });
  [...MATERIALI,...DOCUMENTI].forEach(x=>{ if([x.titolo,x.cat,x.nota,x.fonte||""].join(" ").toLowerCase().includes(q)) ris.push(cardDoc(x)); });
  out.innerHTML = ris.length ? ris.join("") : `<p class="muted">Nessun risultato per «${esc(q)}».</p>`;
  collegaServizi();
}

// Notizie di Caritas Italiana: news.json è aggiornato ogni giorno da GitHub Actions (scripts/aggiorna_notizie.py)
const SITO_APP = "https://paolocri.github.io/formazione-operatori/";
let NOTIZIE = null, notizieErrore = false;
fetch("news.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { NOTIZIE = d; }).catch(() => { notizieErrore = true; }).finally(mostraNotizie);

const dataIt = iso => new Date(iso).toLocaleDateString("it-IT", { day:"numeric", month:"long" });
function cardNotizia(n){
  return `<a class="card news link" href="${esc(n.link)}" target="_blank" rel="noopener">
    ${n.immagine?`<img src="${esc(n.immagine)}" alt="" loading="lazy" onerror="this.remove()">`:""}
    <div class="txt"><span class="eyebrow">${dataIt(n.data)}</span><h3>${esc(n.titolo)}</h3><p class="muted">${esc(n.sommario)}</p><span class="apri">Leggi su caritas.it ↗</span></div></a>`;
}
function mostraNotizie(){
  const box = document.getElementById("box-notizie"); if (!box) return;
  const max = +box.dataset.max || 50;
  if (NOTIZIE && NOTIZIE.notizie.length) box.innerHTML = NOTIZIE.notizie.slice(0,max).map(cardNotizia).join("");
  else if (notizieErrore) box.innerHTML = `<div class="card"><p class="muted">Le notizie si caricano nell'app online. Aprila da <a href="${SITO_APP}" target="_blank" rel="noopener">${SITO_APP.replace("https://","")}</a> oppure riprova quando sei connesso.</p></div>`;
  else box.innerHTML = `<p class="muted">Carico le notizie…</p>`;
  const agg = document.getElementById("agg-notizie");
  if (agg && NOTIZIE) agg.textContent = "Ultimo aggiornamento: " + new Date(NOTIZIE.aggiornato).toLocaleString("it-IT", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
}
function renderNotizie(){
  app.innerHTML = `<div class="stack"><span class="eyebrow">Dalla rete Caritas</span><h1>Notizie</h1>
    <p class="muted">Le ultime notizie pubblicate da Caritas Italiana, aggiornate ogni giorno.</p><p class="note" id="agg-notizie"></p></div>
    <div class="stack" id="box-notizie"></div>`;
  mostraNotizie();
}

function renderLista(tipo){
  const dati = tipo==="materiali"?MATERIALI:DOCUMENTI;
  const cats = [...new Set(dati.map(x=>x.cat))];
  app.innerHTML = `<div class="stack"><span class="eyebrow">${tipo==="materiali"?"Materiali Caritas":"Documenti utili"}</span>
    <h1>${tipo==="materiali"?"Materiali":"Moduli e procedure"}</h1>
    <p class="muted">${tipo==="materiali"?"I principali documenti pubblici di Caritas Italiana. Si aprono dal sito ufficiale, quindi serve la connessione.":"Modelli da usare al Centro e procedure operative. Le voci «Da caricare» aspettano i tuoi file."}</p></div>
    ${cats.map(c=>`<section class="stack"><h2>${esc(c)}</h2>${dati.filter(x=>x.cat===c).map(cardDoc).join("")}</section>`).join("")}`;
}

function cardDoc(x){
  const corpo = `<div class="row"><h3>${esc(x.titolo)}</h3><span class="tag ${x.url?"ok":""}">${esc(x.tipo)}</span></div>
    ${x.fonte?`<span class="eyebrow">${esc(x.fonte)}</span>`:""}<p class="muted">${esc(x.nota)}</p>`;
  return x.url ? `<a class="card link" href="${x.url}" target="_blank" rel="noopener">${corpo}<span class="apri">Apri ↗</span></a>` : `<div class="card">${corpo}</div>`;
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ if (b.dataset.tab!==vista.tab || profondita(vista)) vai({tab:b.dataset.tab}); });
const h = location.hash.slice(1); if (["home","servizi","notizie","materiali","documenti"].includes(h)) vista.tab=h;
try { history.replaceState(vista,""); } catch(e){}
render();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
